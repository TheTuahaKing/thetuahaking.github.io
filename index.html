<!-- Tiger Card -->
<div class="card">
  <h2>🐅 Tiger Surprise 🐅</h2>

  <button onclick="showTiger()"
    style="background:#ffd700;color:#000;border:none;padding:15px 30px;border-radius:30px;font-size:18px;font-weight:bold;">
    Open Tiger
  </button>

  <div id="tigerBox" style="display:none;margin-top:25px;">

    <h2>Your Pic 📸</h2>

    <img src="tiger.jpg"
      style="width:220px;height:220px;border-radius:20px;border:3px solid #ffd700;box-shadow:0 0 20px #ffd700;object-fit:cover;">

  </div>
</div>
