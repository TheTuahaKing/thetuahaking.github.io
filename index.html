<!DOCTYPE html>
<html>
<head>

<title>The Tuaha King Official 👑</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:
  radial-gradient(circle,#3b2600,#000);
  color:white;
  text-align:center;
  overflow-x:hidden;
}


/* Background Stars */

.star{
 position:fixed;
 width:5px;
 height:5px;
 background:#ffd700;
 border-radius:50%;
 box-shadow:0 0 20px #ffd700;
 animation:stars 8s infinite;
}

@keyframes stars{
 0%{
 transform:translateY(100vh);
 opacity:0;
 }
 50%{
 opacity:1;
 }
 100%{
 transform:translateY(-20vh);
 opacity:0;
 }
}


/* Main */

.container{
 padding:40px 20px;
}


/* Crown */

.crown{
 font-size:80px;
 animation:float 2s infinite alternate;
}


@keyframes float{
 from{
 transform:translateY(0);
 }
 to{
 transform:translateY(-15px);
 }
}


/* King Profile */

.king-box{
 margin:20px auto;
}

.king-img{

 width:220px;
 height:220px;
 border-radius:50%;
 object-fit:cover;

 border:5px solid #ffd700;

 box-shadow:
 0 0 25px #ffd700,
 0 0 60px #ffae00;

 animation:glow 2s infinite alternate;

}


@keyframes glow{

from{
transform:scale(1);
}

to{
transform:scale(1.06);
}

}


h1{

color:#ffd700;
font-size:45px;

text-shadow:
0 0 20px #ffd700;

}


/* Cards */


.card{

max-width:650px;

margin:30px auto;

padding:30px;

background:
rgba(255,255,255,0.08);

border-radius:30px;

border:2px solid #ffd700;

box-shadow:
0 0 25px rgba(255,215,0,.3);

backdrop-filter:blur(10px);

}


h2{

color:#ffd700;

}


p{

font-size:19px;

line-height:1.8;

}


/* Buttons */


button{

background:linear-gradient(45deg,#ffd700,#ffae00);

border:none;

padding:15px 35px;

border-radius:50px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}


button:hover{

box-shadow:
0 0 30px #ffd700;

transform:scale(1.05);

}


/* Tiger */

.tiger-img{

width:250px;
height:250px;

object-fit:cover;

border-radius:25px;

border:4px solid #ffd700;

box-shadow:
0 0 30px #ffd700;

}


.footer{

margin-top:50px;

padding:20px;

color:#ffd700;

}


</style>

</head>


<body>
