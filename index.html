<!DOCTYPE html>
<html>
<head>
<title>The Tuaha King Official</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #000000, #2b1b00);
  color: white;
  text-align: center;
}

.container {
  padding: 70px 20px;
}

.crown {
  font-size: 70px;
  animation: glow 2s infinite alternate;
}

h1 {
  font-size: 45px;
  color: #ffd700;
  text-shadow: 0 0 20px #ffd700;
}

.subtitle {
  font-size: 22px;
  color: #eee;
}

.card {
  max-width: 550px;
  margin: 40px auto;
  background: rgba(255,255,255,0.1);
  padding: 35px;
  border-radius: 25px;
  border: 2px solid #ffd700;
  box-shadow: 0 0 25px #ffd700;
}

button {
  background: #ffd700;
  color: black;
  border: none;
  padding: 15px 35px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: bold;
}

button:hover {
  background: white;
}

@keyframes glow {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.15);
  }
}
</style>

</head>

<body>

<div class="container">

<div class="crown">👑</div>

<h1>The Tuaha King Official</h1>

<p class="subtitle">
A special place for a special person ✨
</p>

<div class="card">

<h2>💫 Beautiful Friendship 💫</h2>

<p>
Memories, smiles and special moments that will always stay close to the heart ❤️
</p>

<button>Welcome</button>

</div>

</div>

</body>
</html>
